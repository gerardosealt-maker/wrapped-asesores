<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sendas Wrapped 2025</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <audio id="music" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <div id="login">
        <div class="login-content">
            <img src="logo-sadasi.png" width="140" style="margin-bottom:20px;">
            <h1 style="color:white; font-size: 28px;">TU 2025<br><span style="color:#FF8200;">SENDAS WRAPPED</span></h1>
            <input type="text" id="agentInput" placeholder="TU NOMBRE">
            <button id="startBtn">COMENZAR</button>
        </div>
    </div>

    <div id="capture-area">
        <div id="progressRoot" style="display:none;"></div>
        
        <section class="story">
            <div class="story-body">
                <div id="rank-container"></div>
                <h2>UN AÑO DE ÉXITOS</h2>
                <div class="photo-container"><img src="" class="u-photo"></div>
                <h1 class="u-name-display" style="font-size:22px; color:#FF8200;">---</h1>
                <p class="u-frase" style="margin-top:20px; font-style:italic;"></p>
            </div>
        </section>

        <section class="story">
            <div class="story-body">
                <h2>TU MOMENTO DE ORO</h2>
                <h1 id="u-mejor-mes-nombre" style="font-size: 50px; font-weight: 900;">MES</h1>
                <div class="big-number" id="u-mejor-mes-qty">0</div>
                <h1 style="letter-spacing: 5px;">VENTAS</h1>
                <p class="u-frase" style="margin-top:20px; font-style:italic;"></p>
            </div>
        </section>

        <section class="story">
            <div class="story-body">
                <h2>EL REY DE LOS LEADS</h2>
                <div class="big-number" id="u-leads">0</div>
                <h1>CONTACTOS</h1>
                <div class="mini-stats">
                    <div class="stat-box"><span id="u-citas">0</span><small>CITAS</small></div>
                    <div class="stat-box"><span id="u-visitas">0</span><small>VISITAS</small></div>
                </div>
                <p class="u-frase" style="margin-top:20px; font-style:italic;"></p>
            </div>
        </section>

        <section class="story">
            <div class="story-body">
                <h2>IMPACTO COMERCIAL</h2>
                <div class="big-number" id="u-vnetas" style="color:#FF8200;">0</div>
                <h1>VENTAS NETAS</h1>
                <p style="margin-top:10px;">⚡ <span id="u-vdigital">0</span> DIGITALES</p>
                <p class="u-frase" style="margin-top:20px; font-style:italic;"></p>
            </div>
        </section>

        <section class="story">
            <div class="story-body">
                <div class="card-summary" id="final-card">
                    <img src="logo-sadasi.png" width="80" style="margin-bottom:10px;">
                    <h2 style="color:#000; font-size:16px; margin:0; text-shadow:none;">RESUMEN ANUAL 2025</h2>
                    <h3 class="u-name-display" style="color:#FF8200; font-size:14px; text-shadow:none;">---</h3>
                    <div class="monto-destacado">
                        <small>TOTAL ESCRITURADO</small>
                        <div id="f-monto">---</div>
                    </div>
                    <div class="stats-grid-final">
                        <div class="grid-item"><span>VENTAS</span><strong id="f-vnetas">0</strong></div>
                        <div class="grid-item"><span>ENTREGAS</span><strong id="f-eqty">0</strong></div>
                        <div class="grid-item"><span>LEADS</span><strong id="f-leads">0</strong></div>
                    </div>
                </div>
                <button id="exportBtn">GUARDAR</button>
            </div>
        </section>

        <div id="tapZones" style="display:none;">
            <div id="btnPrev"></div>
            <div id="btnNext"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
