<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sendas Wrapped 2025</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <audio id="music" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <div id="login">
        <div class="login-content">
            <h1 style="color:white; margin-bottom: 20px;">TU 2025<br><span style="color:#FF8200;">SENDAS WRAPPED</span></h1>
            <input type="text" id="agentInput" placeholder="ESCRIBE TU NOMBRE...">
            <button id="startBtn">DESCUBRIR MI AÑO</button>
        </div>
    </div>

    <div id="capture-area">
        <div id="progressRoot" style="display:none;"></div>
        
        <section class="story">
            <div class="story-body">
                <div id="rank-container"></div>
                <h2>UN AÑO DE ÉXITOS</h2>
                <div class="photo-container"><img src="" class="u-photo"></div>
                <h1 class="u-name-display" style="font-size:22px; color:#FF8200;">---</h1>
            </div>
        </section>

        <section class="story">
            <div class="story-body">
                <h2>TU MOMENTO DE ORO</h2>
                <h1 id="u-mejor-mes-nombre" style="font-size: 50px; color:white;">MES</h1>
                <div class="big-number" id="u-mejor-mes-qty">0</div>
                <h1 style="color:white;">VENTAS</h1>
            </div>
        </section>

        <section class="story">
            <div class="story-body">
                <h2>EL REY DE LOS LEADS</h2>
                <div class="big-number" id="u-leads">0</div>
                <h1 style="color:white;">LEADS TOTALES</h1>
                <div class="mini-stats">
                    <div><strong id="u-citas" style="color:#FF8200;">0</strong><br><small>CITAS</small></div>
                    <div class="divider" style="background:white; width:1px; height:30px; margin: 0 15px;"></div>
                    <div><strong id="u-visitas" style="color:#FF8200;">0</strong><br><small>VISITAS</small></div>
                </div>
            </div>
        </section>

        <section class="story">
            <div class="story-body">
                <h2>IMPACTO COMERCIAL</h2>
                <div class="big-number" id="u-vnetas" style="color:#FF8200;">0</div>
                <h1 style="color:white;">VENTAS NETAS</h1>
                <div class="digital-mention" style="color:white; margin-top:10px;">⚡ <span id="u-vdigital">0</span> fueron ventas digitales</div>
            </div>
        </section>

        <section class="story">
            <div class="story-body">
                <div class="card-summary" id="final-card" style="background:white; padding:20px; border-radius:15px; width:90%;">
                    <h2 style="color:black; margin:0;">RESUMEN 2025</h2>
                    <h3 class="u-name-display" style="color:#FF8200; margin-bottom:15px;">---</h3>
                    
                    <div style="background: black; color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px;">
                        <small style="font-size: 10px; display:block; margin-bottom:5px; font-weight:bold; letter-spacing:1px;">MONTO TOTAL ESCRITURADO</small>
                        <div id="f-monto" style="font-size: 32px; font-weight: 900; color: #FF8200;">$0.0M</div>
                    </div>

                    <div class="stats-grid" style="display:flex; justify-content:space-around; border-top:1px solid #eee; padding-top:10px;">
                        <div class="stat-item"><span style="font-size:10px; font-weight:bold; display:block; color:black;">VENTAS</span><strong id="f-vnetas" style="font-size:22px; color:#FF8200;">0</strong></div>
                        <div class="stat-item"><span style="font-size:10px; font-weight:bold; display:block; color:black;">ENTREGAS</span><strong id="f-eqty" style="font-size:22px; color:#FF8200;">0</strong></div>
                        <div class="stat-item"><span style="font-size:10px; font-weight:bold; display:block; color:black;">LEADS</span><strong id="f-leads" style="font-size:22px; color:#FF8200;">0</strong></div>
                    </div>
                </div>
                <button id="exportBtn" style="margin-top:20px; background:#FF8200; color:white; border:none; padding:12px 20px; border-radius:20px; font-weight:bold;">GUARDAR EN GALERÍA</button>
            </div>
        </section>

        <div id="tapZones" style="display:none; position:absolute; inset:0; z-index:150;">
            <div id="btnPrev" style="flex:1;"></div>
            <div id="btnNext" style="flex:3;"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
