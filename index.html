<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sendas Wrapped 2025</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <audio id="music" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <div id="login">
        <div class="login-content">
            <img src="logo-sadasi.png" width="160">
            <h1 style="color:white; margin: 20px 0;">TU 2025<br><span style="color:#FF8200;">SENDAS WRAPPED</span></h1>
            <input type="text" id="agentInput" placeholder="ESCRIBE TU NOMBRE">
            <button id="startBtn">COMENZAR</button>
        </div>
    </div>

    <div id="capture-area">
        <div id="progressRoot" style="display:none;"></div>
        
        <section class="story">
            <div class="story-body">
                <div id="rank-badge-main"></div>
                <h2>UN AÑO DE ÉXITOS</h2>
                <div class="photo-container"><img src="" class="u-photo"></div>
                <h1 class="u-name-display" style="color:#FF8200;">---</h1>
                <p class="u-frase" style="margin-top:20px; font-style:italic;"></p>
            </div>
        </section>

        <section class="story">
            <div class="story-body">
                <h2>TU MEJOR MES</h2>
                <h1 id="u-mejor-mes-nombre" style="font-size: 50px; color: #FF8200;">MES</h1>
                <div class="big-number" id="u-mejor-mes-qty">0</div>
                <h1>VENTAS</h1>
            </div>
        </section>

        <section class="story">
            <div class="story-body">
                <h2>TU ALCANCE</h2>
                <div class="big-number" id="u-leads">0</div>
                <h1>LEADS TOTALES</h1>
                <div class="mini-stats">
                    <div class="stat-box"><span id="u-citas">0</span><small>CITAS</small></div>
                    <div class="stat-box"><span id="u-visitas">0</span><small>VISITAS</small></div>
                </div>
            </div>
        </section>

        <section class="story">
            <div class="story-body">
                <div class="card-summary">
                    <img src="logo-sadasi.png" width="100" style="margin-bottom:15px;">
                    
                    <div class="f-photo-circle">
                        <img src="" class="u-photo">
                    </div>
                    
                    <div id="f-rango">TÍTULO DE HONOR</div>
                    <h3 class="u-name-display" style="margin: 5px 0; color: #fff;">---</h3>
                    <p id="f-frase" style="font-size: 13px; color: #bbb; margin-bottom: 15px;">---</p>

                    <div class="monto-destacado">
                        <small>MONTO ESCRITURADO</small>
                        <div id="f-monto" style="font-size: 32px; font-weight: 900; color: #FF8200;">$0.0M</div>
                    </div>

                    <div class="stats-grid-final">
                        <div class="grid-item"><span>VENTAS NETAS</span><strong id="f-vnetas">0</strong></div>
                        <div class="grid-item"><span>ESCRITURAS</span><strong id="f-eqty">0</strong></div>
                    </div>
                    
                    <p style="font-size: 10px; margin-top: 15px; opacity: 0.5;">SENDAS WRAPPED 2025</p>
                </div>
                <p style="margin-top: 20px; font-size: 12px; opacity: 0.7;">¡Toma una captura de pantalla para compartir!</p>
            </div>
        </section>

        <div id="tapZones" style="display:none;">
            <div id="btnPrev"></div>
            <div id="btnNext"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
